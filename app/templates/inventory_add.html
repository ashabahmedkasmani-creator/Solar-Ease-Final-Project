{% extends 'base.html' %}
{% block title %}Add Inventory - SolarEase{% endblock %}
{% block content %}<div class="container py-4"><div class="col-lg-7 mx-auto"><div class="card bg-dark text-white border-secondary p-4"><h3 class="fw-bold mb-4">Add Equipment</h3><form method="POST"><div class="mb-3"><label class="form-label">Product Name</label><input name="item_name" class="form-control bg-dark text-white border-secondary" required></div><div class="mb-3"><label class="form-label">Category</label><input name="category" class="form-control bg-dark text-white border-secondary" required></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Quantity</label><input type="number" name="quantity" class="form-control bg-dark text-white border-secondary" min="0" required></div><div class="col-md-6 mb-3"><label class="form-label">Unit Price</label><input type="number" name="selling_price" class="form-control bg-dark text-white border-secondary" min="0" step="0.01" required></div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Brand</label><input name="brand" class="form-control bg-dark text-white border-secondary"></div><div class="col-md-6 mb-3"><label class="form-label">Model</label><input name="model" class="form-control bg-dark text-white border-secondary"></div></div><div class="mb-4"><label class="form-label">Supplier</label><input name="supplier" class="form-control bg-dark text-white border-secondary"></div><button class="btn btn-success w-100 fw-bold">Save Equipment</button></form></div></div></div>{% endblock %}
