{% extends 'base.html' %}
{% block title %}Book Site Survey - SolarEase{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card bg-dark text-white p-4 shadow-lg border border-secondary rounded-4">
                <h3 class="fw-bold mb-3 text-white">
                    <i class="fa-solid fa-calendar-plus text-success me-2"></i>Book Site Survey
                </h3>
                <p class="text-muted">Schedule an engineering site survey to check roof orientation, shading conditions, and electrical setup.</p>

                <form action="{{ url_for('surveys.index') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-light">Full Address for Inspection</label>
                        <textarea name="address" class="form-control bg-dark text-white border-secondary" rows="2" placeholder="Street, Sector, City" required></textarea>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-light">Preferred Date</label>
                            <input type="date" name="preferred_date" class="form-control bg-dark text-white border-secondary" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light">Preferred Time Slot</label>
                            <select name="preferred_time" class="form-select bg-dark text-white border-secondary" required>
                                <option value="Morning (10:00 AM - 01:00 PM)">Morning (10:00 AM - 01:00 PM)</option>
                                <option value="Afternoon (02:00 PM - 05:00 PM)">Afternoon (02:00 PM - 05:00 PM)</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-light">Special Notes / Instructions</label>
                        <input type="text" name="notes" class="form-control bg-dark text-white border-secondary" placeholder="e.g. Call before arrival, key with guard">
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold py-3 text-white rounded-3 shadow" style="background-color: #12A566; border: none;">
                        <i class="fa-solid fa-check-circle me-2"></i>Confirm Survey Request
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
